<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <title>INARI · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f0ec; color: #292b26; font-family: "Segoe UI", Arial, Helvetica, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 360px; text-align: center; }
    img { width: 200px; height: auto; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 26px; margin: 20px 0 8px; }
    p { color: #77786f; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button { height: 44px; padding: 0 24px; border: 0; background: #292b26; color: #fff; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/logo-horizontal.png" alt="INARI Tours">
    <h1>You are offline</h1>
    <p>INARI needs a connection to show your tours. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
